---
name: Modem Exporter
version: 1.0.0
slug: modem-exporter
description: Prometheus exporter for Virgin Media Hub style cable modems
url: https://github.com/caraar12345/home-assistant-addons/tree/main/modem-exporter
arch:
  - aarch64
  - amd64
image: ghcr.io/caraar12345/ha-addon-modem-exporter
init: false
ports:
  9781/tcp: 9781
watchdog: http://[HOST]:[PORT:9781]/healthz
options:
  modem_url: https://192.168.100.1/rest/v1
  verify_ssl: false
  scrape_interval: 30
  request_timeout: 10
  log_level: info
schema:
  modem_url: url
  verify_ssl: bool
  scrape_interval: int(5,3600)
  request_timeout: int(1,120)
  loki_url: url?
  loki_username: str?
  loki_password: password?
  loki_job: str?
  loki_host: str?
  log_level: list(debug|info|warning|error)?
