name: Docker build - InfluxDB2
on:
  push:
    branches:
      - main
    paths:
      - influxdb2
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check_submodule.outputs.changed }}
      version: ${{ steps.build_metadata.outputs.version }}
      description: ${{ steps.build_metadata.outputs.description }}
      name: ${{ steps.build_metadata.outputs.name }}
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Check for submodule changes
        id: check_submodule
        run: |
          if git diff --quiet HEAD^ HEAD -- influxdb2; then
            echo "No changes in influxdb2 submodule"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in influxdb2 submodule"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get build metadata
        if: steps.check_submodule.outputs.changed == 'true'
        id: build_metadata
        uses: pietrobolcato/action-read-yaml@1.1.0
        with:
          config: ${{ github.workspace }}/influxdb2/influxdb2/config.yaml

      - name: Get current date
        if: steps.check_submodule.outputs.changed == 'true'
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    if: needs.meta.outputs.changed == 'true'
    uses: ./.github/workflows/reusable-docker-build.yml
    secrets: inherit
    with:
      context: ${{ github.workspace }}/influxdb2/influxdb2
      registry: dockerhub
      image: aaroncarson/ha-addon-influxdb2
      version: ${{ needs.meta.outputs.version }}
      platforms: linux/amd64
      submodules: recursive
      build-args: |
        BUILD_DATE="${{ needs.meta.outputs.date }}"
        BUILD_DESCRIPTION="${{ needs.meta.outputs.description }}"
        BUILD_NAME="${{ needs.meta.outputs.name }}"
        BUILD_REF="${{ github.sha }}"
        BUILD_REPOSITORY="${{ github.server_url }}/${{ github.repository }}"
        BUILD_VERSION="${{ needs.meta.outputs.version }}"
