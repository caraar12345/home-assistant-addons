name: Docker build - Cloudflare Speedtest
on:
  push:
    branches:
      - main
    paths:
      - cloudflare-speedtest/**
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.result }}
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from config.yaml
        id: get_version
        uses: mikefarah/yq@master
        with:
          cmd: yq '.version' cloudflare-speedtest/config.yaml

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  # config.yaml's version is used as an image tag and is what Home Assistant
  # checks to decide whether an update is available. If it isn't bumped,
  # this build would silently overwrite a previously published tag with
  # different content and no HA user would ever see an update, so bump
  # cloudflare-speedtest/config.yaml's version before merging any change to
  # this addon.
  build:
    needs: meta
    uses: ./.github/workflows/reusable-docker-build.yml
    secrets: inherit
    with:
      context: ${{ github.workspace }}/cloudflare-speedtest
      registry: ghcr
      image: ghcr.io/caraar12345/home-assistant-addons/cloudflare-speedtest
      version: ${{ needs.meta.outputs.version }}
      check-published: true
      build-args: |
        BUILD_TIME=${{ needs.meta.outputs.date }}
        BUILD_REVISION=${{ github.sha }}
        BUILD_VERSION=${{ needs.meta.outputs.version }}
