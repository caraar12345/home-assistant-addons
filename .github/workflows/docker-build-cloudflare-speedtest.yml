name: Docker build - Cloudflare Speedtest
on:
  push:
    branches:
      - main
    paths:
      - cloudflare-speedtest/**
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get version from config.yaml
        id: get_version
        uses: mikefarah/yq@master
        with:
          cmd: yq '.version' cloudflare-speedtest/config.yaml

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # config.yaml's version is used as an image tag below and is what Home
      # Assistant checks to decide whether an update is available. If it
      # isn't bumped, this build would silently overwrite a previously
      # published tag with different content and no HA user would ever see
      # an update, so bump cloudflare-speedtest/config.yaml's version before
      # merging any change to this addon.
      - name: Check version isn't already published
        run: |
          if docker buildx imagetools inspect "ghcr.io/caraar12345/home-assistant-addons/cloudflare-speedtest:${{ steps.get_version.outputs.result }}" > /dev/null 2>&1; then
            echo "::error::version ${{ steps.get_version.outputs.result }} (from cloudflare-speedtest/config.yaml) is already published. Bump config.yaml's version before merging."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./cloudflare-speedtest
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_TIME=${{ steps.date.outputs.date }}
            BUILD_REVISION=${{ github.sha }}
            BUILD_VERSION=${{ steps.get_version.outputs.result }}
          tags: |
            ghcr.io/caraar12345/home-assistant-addons/cloudflare-speedtest:latest
            ghcr.io/caraar12345/home-assistant-addons/cloudflare-speedtest:${{ steps.get_version.outputs.result }}
            ghcr.io/caraar12345/home-assistant-addons/cloudflare-speedtest:${{ github.sha }}
