name: Docker build - Music Assistant Ingress Proxy
on:
  push:
    branches:
      - main
    paths:
      - ma-ingress-proxy/**
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.result }}
      name: ${{ steps.get_name.outputs.result }}
      description: ${{ steps.get_description.outputs.result }}
      build_from: ${{ steps.get_build_from.outputs.result }}
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from config.yaml
        id: get_version
        uses: mikefarah/yq@master
        with:
          cmd: yq '.version' ma-ingress-proxy/config.yaml

      - name: Get name from config.yaml
        id: get_name
        uses: mikefarah/yq@master
        with:
          cmd: yq '.name' ma-ingress-proxy/config.yaml

      - name: Get description from config.yaml
        id: get_description
        uses: mikefarah/yq@master
        with:
          cmd: yq '.description' ma-ingress-proxy/config.yaml

      - name: Get amd64 base image from build.yaml
        id: get_build_from
        uses: mikefarah/yq@master
        with:
          cmd: yq '.build_from.amd64' ma-ingress-proxy/build.yaml

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  # config.yaml's version is used as an image tag and is what Home Assistant
  # checks to decide whether an update is available. If it isn't bumped,
  # this build would silently overwrite a previously published tag with
  # different content and no HA user would ever see an update, so bump
  # ma-ingress-proxy/config.yaml's version before merging any change to this
  # addon.
  build:
    needs: meta
    uses: ./.github/workflows/reusable-docker-build.yml
    secrets: inherit
    with:
      context: ${{ github.workspace }}/ma-ingress-proxy
      registry: ghcr
      image: ghcr.io/caraar12345/ha-addon-ma-ingress-proxy
      version: ${{ needs.meta.outputs.version }}
      check-published: true
      build-args: |
        BUILD_FROM=${{ needs.meta.outputs.build_from }}
        BUILD_DATE=${{ needs.meta.outputs.date }}
        BUILD_DESCRIPTION=${{ needs.meta.outputs.description }}
        BUILD_NAME=${{ needs.meta.outputs.name }}
        BUILD_REF=${{ github.sha }}
        BUILD_REPOSITORY=${{ github.repository }}
        BUILD_VERSION=${{ needs.meta.outputs.version }}
