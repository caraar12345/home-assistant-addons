name: Docker build - cAdvisor
on:
  push:
    branches:
      - main
    paths:
      - cadvisor/**
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version from config.yml
        id: get_version
        uses: mikefarah/yq@master
        with:
          cmd: yq '.version' cadvisor/config.yml

  build:
    needs: meta
    uses: ./.github/workflows/reusable-docker-build.yml
    secrets: inherit
    with:
      context: ${{ github.workspace }}/cadvisor
      registry: dockerhub
      image: aaroncarson/hassio-cadvisor
      version: ${{ needs.meta.outputs.version }}
